name: CI — Lint, Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Backend ──────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devops_platform_test
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devops_user:test_secret@localhost:5432/devops_platform_test?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1d
      ENCRYPTION_KEY: ci-test-encryption-key-32chars
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma db push --accept-data-loss

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --passWithNoTests --forceExit --ci

      - name: Build
        run: npm run build

  # ─── Frontend ─────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: 1

  # ─── E2E Tests (Cypress) ──────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devops_platform
          POSTGRES_USER: devops_user
          POSTGRES_PASSWORD: test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devops_user:test_secret@localhost:5432/devops_platform?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ci-test-encryption-key-32chars
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:3000
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Setup database
        run: cd backend && npx prisma generate && npx prisma db push --accept-data-loss

      - name: Start backend
        run: cd backend && npm run build && node dist/main.js &
        env:
          NODE_ENV: test

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Start frontend
        run: cd frontend && npm run build && npm start &
        env:
          BACKEND_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: 1

      - name: Wait for services
        run: |
          npx wait-on http://localhost:3001/api/health http://localhost:3000 --timeout 60000

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          wait-on: http://localhost:3000
          wait-on-timeout: 60
          browser: chrome
          headless: true
