name: CD — Build, Sign (Cosign), SBOM (Syft) & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/web

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: write

jobs:
  build-backend:
    name: Build, SBOM & Cosign Sign Backend Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign (Keyless OIDC Signing)
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: backend-sbom.spdx.json

      - name: Sign Backend OCI Image with Cosign (Keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ${{ env.BACKEND_IMAGE }}@${{ steps.build.outputs.digest }}

  build-frontend:
    name: Build, SBOM & Cosign Sign Frontend Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign (Keyless OIDC Signing)
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push frontend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BACKEND_URL=http://backend:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: frontend-sbom.spdx.json

      - name: Sign Frontend OCI Image with Cosign (Keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ${{ env.FRONTEND_IMAGE }}@${{ steps.build.outputs.digest }}

  pr-preview-environment:
    name: Ephemeral PR Preview Environment (Faz 8 — I6)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision / Teardown Ephemeral PR Preview Namespace
        run: |
          PR_NS="orbitron-pr-${{ github.event.pull_request.number }}"
          if [ "${{ github.event.action }}" = "closed" ]; then
            echo "Destroying ephemeral preview namespace: ${PR_NS}"
          else
            echo "Provisioning ephemeral preview environment: https://pr-${{ github.event.pull_request.number }}.preview.orbitron.cloud (Namespace: ${PR_NS})"
          fi
